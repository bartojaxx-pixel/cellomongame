<!DOCTYPE html>
<html>
<head>
<title>Cellomon</title>
<style>
    body {
        background: #1a1a1a;
        color: white;
        font-family: Arial;
        margin: 0;
        text-align: center;
    }

    .screen { display: none; }
    .active { display: block; }

    /* Loading Screen */
    #loading h1 {
        animation: pulse 1.5s infinite;
        margin-top: 200px;
        font-size: 50px;
    }
    @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
    }

    /* Rarity Colors */
    .card-gold { background: linear-gradient(#d4af37, #b8860b); }
    .card-purple { background: linear-gradient(#6a0dad, #4b0082); }
    .card-blue { background: linear-gradient(#1e90ff, #4169e1); }
    .card-green { background: linear-gradient(#228b22, #006400); }

    /* Deck Bar */
    #deckBar {
        position: fixed;
        bottom: 0;
        width: 100%;
        background: #111;
        padding: 10px;
        border-top: 3px solid #333;
        height: 220px;
        overflow-x: auto;
        white-space: nowrap;
    }

    #deckLabel {
        font-size: 24px;
        margin-bottom: 10px;
    }

    .deckCard {
        padding: 15px;
        margin: 5px;
        border-radius: 12px;
        width: 160px;
        height: 200px;
        display: inline-block;
        transition: transform 0.2s;
        cursor: pointer;
        font-size: 18px;
        color: white;
    }

    .deckCard:hover {
        transform: translateY(-12px) scale(1.08);
    }

    /* Battle Zone */
    #battleZone {
        margin-top: 20px;
        padding-bottom: 240px;
    }

    .battleCard {
        padding: 20px;
        margin: 10px;
        border-radius: 12px;
        width: 220px;
        height: 260px;
        display: inline-block;
        font-size: 22px;
        color: white;
    }

    #vsSymbol {
        font-size: 50px;
        margin: 20px;
    }

    /* Battle Log – horizontal scroll */
    #battleLog {
        background: #000;
        width: 80%;
        height: 80px;
        margin: 20px auto;
        padding: 10px;
        border-radius: 10px;
        overflow-x: auto;
        overflow-y: hidden;
        text-align: left;
        font-size: 16px;
        white-space: nowrap;
    }
    #battleLog p {
        display: inline-block;
        margin-right: 20px;
    }

    /* Buttons */
    button {
        margin: 5px;
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        background: #3a3a3a;
        color: white;
        cursor: pointer;
        font-size: 18px;
    }
    button:hover {
        background: #505050;
    }

    /* Boost Area */
    #boostArea {
        margin-top: 10px;
        font-size: 20px;
    }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading" class="screen active">
    <h1>Loading...</h1>
    <button onclick="goToModeSelect()">Start</button>
</div>

<!-- MODE SELECT -->
<div id="modeSelect" class="screen">
    <h1>Select Mode</h1>
    <button onclick="startGame(3)">3 Cards</button>
    <button onclick="startGame(4)">4 Cards</button>
    <button onclick="startGame(5)">5 Cards</button>
    <button onclick="startGame(6)">6 Cards</button>
    <button onclick="startGame(7)">7 Cards</button>
</div>

<!-- GAME SCREEN -->
<div id="game" class="screen">

    <div id="battleZone">
        <div id="aiCard"></div>
        <div id="vsSymbol">VS</div>
        <div id="playerCard"></div>

        <div id="boostArea">Boosts: <span id="boostList"></span></div>

        <div id="battleLog"></div>

        <button onclick="playerAttack()">Attack</button>
        <button onclick="playerBoost('Animal')">Animal Protein</button>
        <button onclick="playerBoost('Plant')">Plant Protein</button>
        <button onclick="playerBoost('DNA')">DNA</button>
    </div>

    <div id="deckBar">
        <div id="deckLabel">DECK</div>
        <div id="playerDeck"></div>
    </div>

</div>

<script>
/* CARD DATABASE */
const cards = [
    {name:"Nucleus", stars:4, dmg:3, type:"Both"},
    {name:"Mitochondria", stars:5, dmg:4, type:"Both"},
    {name:"Golgi Body", stars:3, dmg:2, type:"Both"},
    {name:"Cytoskeleton", stars:2, dmg:1, type:"Both"},
    {name:"Lysosome", stars:3, dmg:2, type:"Both"},
    {name:"Cytoplasm", stars:3, dmg:2, type:"Both"},
    {name:"Nucleolus", stars:3, dmg:2, type:"Both"},

    {name:"Rough ER", stars:3, dmg:2, type:"Animal"},
    {name:"Cell Membrane", stars:2, dmg:1, type:"Animal"},
    {name:"Centriole", stars:3, dmg:2, type:"Animal"},

    {name:"Chloroplast", stars:4, dmg:3, type:"Plant"},
    {name:"Cell Wall", stars:3, dmg:2, type:"Plant"},
    {name:"Large Central Vacuole", stars:3, dmg:2, type:"Plant"},
    {name:"Smooth ER", stars:3, dmg:2, type:"Plant"},

    {name:"Influenza", stars:4, dmg:0, type:"Virus"}
];

/* RARITY SYSTEM – harder */
function weightedRandomCard() {
    const roll = Math.random();
    if (roll < 0.70) return cards.filter(c => c.stars <= 2)[Math.floor(Math.random()*cards.filter(c => c.stars <= 2).length)];
    if (roll < 0.90) return cards.filter(c => c.stars === 3)[Math.floor(Math.random()*cards.filter(c => c.stars === 3).length)];
    if (roll < 0.98) return cards.filter(c => c.stars === 4)[Math.floor(Math.random()*cards.filter(c => c.stars === 4).length)];
    return cards.filter(c => c.stars === 5)[Math.floor(Math.random()*cards.filter(c => c.stars === 5).length)];
}

/* CARD COLOR */
function getCardColor(stars) {
    if (stars >= 5) return "card-gold";
    if (stars === 4) return "card-purple";
    if (stars === 3) return "card-blue";
    return "card-green";
}

/* GAME STATE */
let playerDeck = [];
let aiDeck = [];
let deckSize = 3;
let roundIndex = 0;      // which AI card to pull next
let playerTurn = true;
let activePlayerCard = null;
let activeAICard = null;

/* SCREEN FLOW */
function goToModeSelect() {
    document.getElementById("loading").classList.remove("active");
    document.getElementById("modeSelect").classList.add("active");
}

function startGame(size) {
    deckSize = size;
    playerDeck = [];
    aiDeck = [];
    roundIndex = 0;
    activePlayerCard = null;
    activeAICard = null;
    document.getElementById("battleLog").innerHTML = "";
    document.getElementById("boostList").innerHTML = "";

    for (let i = 0; i < deckSize; i++) {
        playerDeck.push(JSON.parse(JSON.stringify(weightedRandomCard())));
        aiDeck.push(JSON.parse(JSON.stringify(weightedRandomCard())));
    }

    document.getElementById("modeSelect").classList.remove("active");
    document.getElementById("game").classList.add("active");

    renderPlayerDeck();
    decideFirstTurn();
}

/* RENDER PLAYER DECK */
function renderPlayerDeck() {
    let html = "";
    playerDeck.forEach((c, i) => {
        html += `<div class='deckCard ${getCardColor(c.stars)}' onclick='placeCard(${i})'>
                    ${c.name}<br>${c.stars}★<br>${c.dmg} DMG
                 </div>`;
    });
    document.getElementById("playerDeck").innerHTML = html;
}

/* PLACE CARD INTO BATTLE */
function placeCard(index) {
    if (activePlayerCard) return; // already have a card on field

    activePlayerCard = playerDeck[index];
    playerDeck.splice(index, 1);
    renderPlayerDeck();

    renderBattleCards();

    if (!playerTurn) aiTurn();
}

/* RENDER BATTLE CARDS */
function renderBattleCards() {
    if (activePlayerCard) {
        document.getElementById("playerCard").innerHTML =
            `<div class='battleCard ${getCardColor(activePlayerCard.stars)}'>
                ${activePlayerCard.name}<br>${activePlayerCard.stars}★ HP<br>${activePlayerCard.dmg} DMG
             </div>`;
    } else {
        document.getElementById("playerCard").innerHTML = "";
    }

    if (!activeAICard && roundIndex < aiDeck.length) {
        activeAICard = aiDeck[roundIndex];
        roundIndex++;
    }

    if (activeAICard) {
        document.getElementById("aiCard").innerHTML =
            `<div class='battleCard ${getCardColor(activeAICard.stars)}'>
                ${activeAICard.name}<br>${activeAICard.stars}★ HP<br>${activeAICard.dmg} DMG
             </div>`;
    } else {
        document.getElementById("aiCard").innerHTML = "";
    }
}

/* FIRST TURN PICK */
function decideFirstTurn() {
    playerTurn = Math.random() < 0.5;
    log(playerTurn ? "You go first!" : "AI goes first!");
}

/* LOG */
function log(text) {
    document.getElementById("battleLog").innerHTML += `<p>${text}</p>`;
}

/* BOOST SYSTEM */
function playerBoost(type) {
    if (!playerTurn || !activePlayerCard) return log("Not your turn or no card placed.");

    placeBoost(activePlayerCard, type, true);
    playerTurn = false;
    aiTurn();
}

function placeBoost(card, type, isPlayer) {
    if (type === "Animal" && card.type === "Animal") {
        card.dmg += 1;
        log(`${isPlayer ? "You" : "AI"} used Animal Protein on ${card.name}.`);
    } else if (type === "Plant" && card.type === "Plant") {
        card.stars += 1;
        log(`${isPlayer ? "You" : "AI"} used Plant Protein on ${card.name}.`);
    } else if (type === "DNA" && card.type === "Both") {
        card.stars += 1;
        log(`${isPlayer ? "You" : "AI"} used DNA on ${card.name}.`);
    } else {
        log(`${isPlayer ? "You" : "AI"} tried to boost but it failed.`);
    }

    document.getElementById("boostList").innerHTML += `${type} `;
    renderBattleCards();
}

/* PLAYER ATTACK */
function playerAttack() {
    if (!playerTurn || !activePlayerCard || !activeAICard) return log("Not your turn or missing cards.");

    log(`You attack with ${activePlayerCard.name}!`);
    resolveCombat(true);
    playerTurn = false;
    aiTurn();
}

/* AI TURN */
function aiTurn() {
    if (!activeAICard) {
        renderBattleCards();
        if (!activeAICard) {
            log("AI has no cards left.");
            return;
        }
    }

    const roll = Math.random();
    if (roll < 0.3) {
        if (activeAICard.type === "Animal") placeBoost(activeAICard, "Animal", false);
        else if (activeAICard.type === "Plant") placeBoost(activeAICard, "Plant", false);
        else if (activeAICard.type === "Both") placeBoost(activeAICard, "DNA", false);
        else log("AI tried to boost but failed.");

        playerTurn = true;
        return;
    }

    log(`AI attacks with ${activeAICard.name}!`);
    resolveCombat(false);
    playerTurn = true;
}

/* SIMPLE COMBAT – STARS = HP, winner stays */
function resolveCombat(playerInitiated) {

    if (activeAICard && activeAICard.name === "Influenza" && playerInitiated) {
        log("Influenza triggers Infection Swap!");
        let virusHP = activeAICard.stars;
        for (let i = 0; i < 3; i++) {
            virusHP -= activePlayerCard.dmg;
        }
        if (virusHP <= 0) {
            log("You killed Influenza!");
            activeAICard = null;
        } else {
            log("Influenza survives. Both cards die.");
            activeAICard = null;
            activePlayerCard = null;
        }
        renderBattleCards();
        return;
    }

    // Both hit each other
    activeAICard.stars -= activePlayerCard.dmg;
    activePlayerCard.stars -= activeAICard.dmg;

    let playerAlive = activePlayerCard.stars > 0;
    let aiAlive = activeAICard.stars > 0;

    if (playerAlive && !aiAlive) {
        log("You win this clash! Your card stays on the field.");
        activeAICard = null;
    } else if (!playerAlive && aiAlive) {
        log("AI wins this clash! AI card stays on the field.");
        activePlayerCard = null;
    } else if (!playerAlive && !aiAlive) {
        log("Both cards die in the clash!");
        activePlayerCard = null;
        activeAICard = null;
    } else {
        log("Both cards survive and stay on the field.");
    }

    renderBattleCards();
}

</script>

</body>
</html>
