<!DOCTYPE html>
<html>
<head>
<title>Cellomon</title>

<style>
/* GLOBAL */
body {
    background: #1a1a1a;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
}

.screen { display: none; }
.active { display: block; }

/* CARD COLORS */
.card-gold { background: linear-gradient(#d4af37, #b8860b); }
.card-purple { background: linear-gradient(#6a0dad, #4b0082); }
.card-blue { background: linear-gradient(#1e90ff, #4169e1); }
.card-green { background: linear-gradient(#228b22, #006400); }

/* GAME LAYOUT */
#gameLayout {
    display: flex;
    height: 100vh;
    box-sizing: border-box;
}

#leftDeck {
    width: 22%;
    background: #111;
    border-right: 2px solid #333;
    padding: 10px;
    overflow-y: auto;
}

#centerBattle {
    width: 56%;
    padding: 10px;
    text-align: center;
}

#rightBoosters {
    width: 22%;
    background: #111;
    border-left: 2px solid #333;
    padding: 10px;
    overflow-y: auto;
}

.deckCard {
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    width: 100%;
    height: 140px;
    cursor: pointer;
    font-size: 16px;
    color: white;
    transition: transform 0.2s;
}

.deckCard:hover {
    transform: translateY(-5px) scale(1.05);
}

/* BATTLE CARDS */
.battleRow {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.battleCard {
    padding: 15px;
    border-radius: 12px;
    width: 200px;
    height: 230px;
    font-size: 18px;
    color: white;
    position: relative;
}

.boosterAttached {
    position: absolute;
    right: -70px;
    top: 20px;
    width: 60px;
    height: 90px;
    border-radius: 8px;
    background: #444;
    font-size: 12px;
    padding: 5px;
}

/* KO ANIMATION */
.ko-anim {
    animation: koPop 0.5s forwards;
}
@keyframes koPop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.7); opacity: 0.7; }
    100% { transform: scale(0); opacity: 0; }
}

/* BATTLE LOG */
#battleLog {
    background: #000;
    width: 90%;
    height: 80px;
    margin: 10px auto;
    padding: 8px;
    border-radius: 10px;
    overflow-x: auto;
    white-space: nowrap;
    font-size: 14px;
}
#battleLog p {
    display: inline-block;
    margin-right: 20px;
}

/* BUTTONS */
button {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: #3a3a3a;
    color: white;
    cursor: pointer;
    font-size: 16px;
}
button:hover {
    background: #505050;
}

/* START SCREEN */
#startScreen h1 {
    margin-top: 40px;
    font-size: 32px;
}

#mainMenuButtons {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
}

/* SHINY BANNER */
#shinyBanner {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: gold;
    color: black;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 18px;
    display: none;
    z-index: 999;
    animation: shinyFlash 1.5s forwards;
}
@keyframes shinyFlash {
    0% { opacity: 0; transform: translateX(-50%) scale(0.8); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
}

/* RULES PANEL — MEDIUM CARDS, COLUMN LAYOUT, SNES ICONS */
#rulesPanel {
    margin-top: 15px;
}

.ruleCard {
    background: #222;
    border: 2px solid #555;
    border-radius: 12px;
    padding: 12px;
    margin: 10px auto;
    width: 80%;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: popIn 0.4s ease-out;
}

.ruleIcon {
    width: 32px;
    height: 32px;
    image-rendering: pixelated;
}

/* SNES 4‑color palette */
.snesIcon {
    filter: grayscale(20%) brightness(1.2) contrast(1.1);
}

/* POP‑IN ANIMATION */
@keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    60% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
}
</style>

</head>
<body>

<!-- SHINY BANNER -->
<div id="shinyBanner">You got a SHINY!</div>

<!-- START SCREEN -->
<div id="startScreen" class="screen active">
    <h1>Cellomon</h1>
    <p>Welcome to Cellomon. Choose what you want to do.</p>

    <div id="mainMenuButtons">
        <button onclick="openPlayMenu()">Play Match</button>
        <button onclick="openStorage()">Storage</button>
        <button onclick="openShop()">Shop</button>
        <button onclick="openQuiz()">Quiz</button>
        <button onclick="openSettings()">Settings</button>
        <button onclick="openRules()">Rules</button>
    </div>

    <!-- PLAY MENU -->
    <div id="playMenu" style="margin-top:15px; display:none;">
        <p>Select a mode:</p>
        <button onclick="startGame(3)">3 vs 3</button>
        <button onclick="startGame(5)">5 vs 5</button>
        <button onclick="startGame(7)">7 vs 7</button>
    </div>

    <!-- STORAGE PANEL -->
    <div id="storagePanel" style="margin-top:15px; display:none;">
        <h3>Shiny Storage</h3>
        <div id="storageList"></div>
        <button onclick="sellExtras()">Sell Extra Shinies</button>
    </div>

    <!-- SHOP PANEL -->
    <div id="shopPanel" style="margin-top:15px; display:none;">
        <h3>Shop</h3>
        <div id="shopInfo"></div>
        <button onclick="buyPotion()">Buy Potion</button>
    </div>

    <!-- QUIZ PANEL -->
    <div id="quizPanel" style="margin-top:15px; display:none;">
        <h3>Quiz: Earn Potions</h3>
        <p>Answer correctly to earn a potion.</p>
        <button onclick="askQuizQuestion()">Answer Question</button>
    </div>

    <!-- SETTINGS PANEL -->
    <div id="settingsPanel" style="margin-top:15px; display:none;">
        <h3>Settings</h3>
        <p>(More settings coming soon.)</p>
    </div>

    <!-- RULES PANEL -->
    <div id="rulesPanel" style="margin-top:15px; display:none;">
        <h3>Game Rules</h3>
        <div id="rulesList"></div>
    </div>

    <p style="margin-top:20px;">
        Coins: <span id="coinCount">0</span> |
        Potions: <span id="potionCount">0</span>
    </p>
</div>

<!-- GAME SCREEN -->
<div id="game" class="screen">
    <div id="gameLayout">

        <!-- LEFT DECK -->
        <div id="leftDeck">
            <h2>Deck</h2>
            <div id="playerDeck"></div>
        </div>

        <!-- CENTER BATTLE -->
        <div id="centerBattle">
            <div class="battleRow">
                <div id="aiCard"></div>
                <div id="vsSymbol">VS</div>
                <div id="playerCard"></div>
            </div>

            <div id="boostArea">
                Boosts used: <span id="boostList"></span>
            </div>

            <div id="battleLog"></div>

            <div id="buttonRow">
                <button onclick="playerAttack()">Attack</button>
                <button onclick="playerUseBooster()">Use Booster</button>
                <button onclick="endMatch()">End Match</button>
            </div>
        </div>

        <!-- RIGHT BOOSTERS -->
        <div id="rightBoosters">
            <h2>Boosters</h2>
            <div id="boosterDeck"></div>
        </div>

    </div>
</div>

<script>
/* CARD DATABASE */
const cards = [
    {name:"Nucleus", stars:4, dmg:3, type:"Both"},
    {name:"Mitochondria", stars:5, dmg:4, type:"Both"},
    {name:"Golgi Body", stars:3, dmg:2, type:"Both"},
    {name:"Cytoskeleton", stars:2, dmg:1, type:"Both"},
    {name:"Lysosome", stars:3, dmg:2, type:"Both"},
    {name:"Cytoplasm", stars:3, dmg:2, type:"Both"},
    {name:"Nucleolus", stars:3, dmg:2, type:"Both"},

    {name:"Rough ER", stars:3, dmg:2, type:"Animal"},
    {name:"Cell Membrane", stars:2, dmg:1, type:"Animal"},
    {name:"Centriole", stars:3, dmg:2, type:"Animal"},

    {name:"Chloroplast", stars:4, dmg:3, type:"Plant"},
    {name:"Cell Wall", stars:3, dmg:2, type:"Plant"},
    {name:"Large Central Vacuole", stars:3, dmg:2, type:"Plant"},
    {name:"Smooth ER", stars:3, dmg:2, type:"Plant"},

    {name:"Influenza", stars:4, dmg:0, type:"Virus"}
];

/* RARITY SYSTEM */
function weightedRandomCard() {
    const roll = Math.random();
    if (roll < 0.70) return cards.filter(c => c.stars <= 2)[Math.floor(Math.random()*cards.filter(c => c.stars <= 2).length)];
    if (roll < 0.90) return cards.filter(c => c.stars === 3)[Math.floor(Math.random()*cards.filter(c => c.stars === 3).length)];
    if (roll < 0.98) return cards.filter(c => c.stars === 4)[Math.floor(Math.random()*cards.filter(c => c.stars === 4).length)];
    return cards.filter(c => c.stars === 5)[Math.floor(Math.random()*cards.filter(c => c.stars === 5).length)];
}

/* CARD COLOR */
function getCardColor(stars) {
    if (stars >= 5) return "card-gold";
    if (stars === 4) return "card-purple";
    if (stars === 3) return "card-blue";
    return "card-green";
}

/* META GAME STATE */
let coins = 0;
let potions = 0;
let shinyStorage = [];

/* GAME STATE */
let playerDeck = [];
let aiDeck = [];
let boosterDeck = [];
let deckSize = 3;
let aiIndex = 0;
let playerTurn = true;
let activePlayerCard = null;
let activeAICard = null;
let attachedBooster = null;
let selectedBoosterIndex = null;
let matchWon = false;

/* MENU HANDLERS */
function hidePanels() {
    document.getElementById("playMenu").style.display = "none";
    document.getElementById("storagePanel").style.display = "none";
    document.getElementById("shopPanel").style.display = "none";
    document.getElementById("quizPanel").style.display = "none";
    document.getElementById("settingsPanel").style.display = "none";
    document.getElementById("rulesPanel").style.display = "none";
}

function openPlayMenu() { hidePanels(); document.getElementById("playMenu").style.display = "block"; }
function openStorage() { hidePanels(); document.getElementById("storagePanel").style.display = "block"; renderStorage(); }
function openShop() { hidePanels(); document.getElementById("shopPanel").style.display = "block"; renderShop(); }
function openQuiz() { hidePanels(); document.getElementById("quizPanel").style.display = "block"; }
function openSettings() { hidePanels(); document.getElementById("settingsPanel").style.display = "block"; }
function openRules() { hidePanels(); document.getElementById("rulesPanel").style.display = "block"; renderRules(); }

/* RULES PANEL — SNES ICONS + POP-IN CARDS */
const ruleData = [
    {icon:"⭐", text:"Cards stay on the battlefield until HP reaches 0."},
    {icon:"🗡️", text:"Winner card stays; loser card is replaced."},
    {icon:"🧪", text:"Protein boosters give +1 HP or +1 DMG."},
    {icon:"🔬", text:"DNA boosters give +2 HP or +2 DMG."},
    {icon:"💥", text:"Nucleus gets +2 HP AND +2 DMG from DNA boosters."},
    {icon:"🎯", text:"HP does NOT reset between rounds."},
    {icon:"📦", text:"Shinies go into Storage automatically."},
    {icon:"💰", text:"Sell duplicate shinies for coins."},
    {icon:"🌟", text:"Shiny odds depend on rarity (1/100 to 1/800)."},
    {icon:"🧠", text:"Quiz answers earn potions."},
    {icon:"⚙️", text:"Potions increase shiny odds for rarer cards."},
    {icon:"🪬", text:"Influenza has a special infection ability."},
    {icon:"📜", text:"Battle log scrolls horizontally."},
    {icon:"🎮", text:"Deck left, boosters right, battle center."}
];

function renderRules() {
    const list = document.getElementById("rulesList");
    list.innerHTML = "";
    ruleData.forEach(rule => {
        list.innerHTML += `
            <div class="ruleCard">
                <div class="ruleIcon snesIcon">${rule.icon}</div>
                <div>${rule.text}</div>
            </div>
        `;
    });
}

/* STORAGE */
function renderStorage() {
    const list = document.getElementById("storageList");
    if (shinyStorage.length === 0) {
        list.innerHTML = "No shinies yet.";
        return;
    }
    list.innerHTML = shinyStorage.map((s,i)=>`${i+1}. ${s.name} (${s.stars}★)`).join("<br>");
}

function sellExtras() {
    if (shinyStorage.length <= 1) {
        alert("You need duplicates to sell extras.");
        return;
    }
    let nameCount = {};
    shinyStorage.forEach(s => nameCount[s.name] = (nameCount[s.name]||0)+1);
    let newStorage = [];
    let earned = 0;
    shinyStorage.forEach(s => {
        if (nameCount[s.name] > 1) {
            nameCount[s.name]--;
            earned += s.stars * 5;
        } else newStorage.push(s);
    });
    shinyStorage = newStorage;
    coins += earned;
    updateMetaUI();
    renderStorage();
    alert("You sold extra shinies for " + earned + " coins.");
}

/* SHOP */
function renderShop() {
    document.getElementById("shopInfo").innerHTML =
        `Potions increase shiny odds for rarer cards.<br>
         Each potion costs 10 coins.<br>
         Coins: ${coins}, Potions: ${potions}`;
}

function buyPotion() {
    if (coins < 10) return alert("Not enough coins.");
    coins -= 10;
    potions += 1;
    updateMetaUI();
    alert("You bought a potion!");
}

/* QUIZ */
function askQuizQuestion() {
    const pool = cards.filter(c => c.type !== "Virus");
    const c = pool[Math.floor(Math.random()*pool.length)];
    let ans = c.type.toLowerCase();
    const user = prompt(`Which cell type is ${c.name} from? (animal/plant/both)`);
    if (!user) return;
    if (user.toLowerCase() === ans) {
        potions += 1;
        updateMetaUI();
        alert("Correct! You earned a potion.");
    } else alert("Incorrect. Correct answer: " + ans);
}

/* META UI */
function updateMetaUI() {
    document.getElementById("coinCount").innerText = coins;
    document.getElementById("potionCount").innerText = potions;
}

/* START GAME */
function startGame(size) {
    deckSize = size;
    playerDeck = [];
    aiDeck = [];
    boosterDeck = [];
    aiIndex = 0;
    activePlayerCard = null;
    activeAICard = null;
    attachedBooster = null;
    selectedBoosterIndex = null;
    matchWon = false;

    document.getElementById("battleLog").innerHTML = "";
    document.getElementById("boostList").innerHTML = "";

    for (let i = 0; i < deckSize; i++) {
        playerDeck.push(JSON.parse(JSON.stringify(weightedRandomCard())));
        aiDeck.push(JSON.parse(JSON.stringify(weightedRandomCard())));
    }

    let boosterCount = deckSize === 3 ? 2 : deckSize === 5 ? 3 : 4;
    for (let i = 0; i < boosterCount; i++) {
        boosterDeck.push({type: Math.random()<0.5 ? "Protein" : "DNA"});
    }

    document.getElementById("startScreen").classList.remove("active");
    document.getElementById("game").classList.add("active");

    renderPlayerDeck();
    renderBoosterDeck();
    decideFirstTurn();
}

/* RENDER DECK */
function renderPlayerDeck() {
    document.getElementById("playerDeck").innerHTML =
        playerDeck.map((c,i)=>`
            <div class="deckCard ${getCardColor(c.stars)}" onclick="placeCard(${i})">
                ${c.name}<br>${c.stars}★ HP<br>${c.dmg} DMG
            </div>
        `).join("");
}

function renderBoosterDeck() {
    document.getElementById("boosterDeck").innerHTML =
        boosterDeck.map((b,i)=>`
            <div class="deckCard" style="height:90px;" onclick="selectBooster(${i})">
                ${b.type}<br>Boost
            </div>
        `).join("");
}

/* BOOSTERS */
function selectBooster(i) {
    selectedBoosterIndex = i;
    log("Selected booster: " + boosterDeck[i].type);
}

/* PLACE CARD */
function placeCard(index) {
    if (activePlayerCard) return;
    activePlayerCard = playerDeck[index];
    playerDeck.splice(index,1);
    renderPlayerDeck();
    renderBattleCards();
    if (!playerTurn) aiTurn();
}

/* RENDER BATTLE CARDS */
function renderBattleCards() {
    if (!activeAICard && aiIndex < aiDeck.length) {
        activeAICard = aiDeck[aiIndex++];
    }

    document.getElementById("aiCard").innerHTML = activeAICard ? `
        <div class="battleCard ${getCardColor(activeAICard.stars)}" id="aiBattleCard">
            ${activeAICard.name}<br>${activeAICard.stars}★ HP<br>${activeAICard.dmg} DMG
        </div>` : "";

    let boosterHTML = attachedBooster ? `
        <div class="boosterAttached">${attachedBooster.type}<br>Active</div>` : "";

    document.getElementById("playerCard").innerHTML = activePlayerCard ? `
        <div class="battleCard ${getCardColor(activePlayerCard.stars)}" id="playerBattleCard">
            ${activePlayerCard.name}<br>${activePlayerCard.stars}★ HP<br>${activePlayerCard.dmg} DMG
            ${boosterHTML}
        </div>` : "";
}

/* FIRST TURN */
function decideFirstTurn() {
    playerTurn = Math.random() < 0.5;
    log(playerTurn ? "You go first!" : "AI goes first!");
}

/* LOG */
function log(t) {
    document.getElementById("battleLog").innerHTML += `<p>${t}</p>`;
}

/* BOOSTER USE */
function playerUseBooster() {
    if (!playerTurn || !activePlayerCard) return log("Not your turn or no card placed.");
    if (selectedBoosterIndex === null) return log("Select a booster first.");

    const booster = boosterDeck[selectedBoosterIndex];
    let choice = prompt("Boost HP or DMG? (hp/dmg)");
    if (!choice) return;
    choice = choice.toLowerCase();

    if (booster.type === "Protein") {
        if (choice === "hp") activePlayerCard.stars++;
        else if (choice === "dmg") activePlayerCard.dmg++;
        else return log("Invalid choice.");
    } else {
        if (activePlayerCard.name === "Nucleus") {
            activePlayerCard.stars += 2;
            activePlayerCard.dmg += 2;
        } else if (choice === "hp") activePlayerCard.stars += 2;
        else if (choice === "dmg") activePlayerCard.dmg += 2;
        else return log("Invalid choice.");
    }

    attachedBooster = booster;
    boosterDeck.splice(selectedBoosterIndex,1);
    selectedBoosterIndex = null;

    renderBoosterDeck();
    renderBattleCards();

    document.getElementById("boostList").innerHTML += booster.type + " ";
    playerTurn = false;
    aiTurn();
}

/* ATTACK */
function playerAttack() {
    if (!playerTurn || !activePlayerCard || !activeAICard) return log("Not your turn.");
    log("You attack with " + activePlayerCard.name + "!");
    resolveCombat(true);
    playerTurn = false;
    aiTurn();
}

/* AI TURN */
function aiTurn() {
    if (!activeAICard && aiIndex >= aiDeck.length) {
        log("AI has no cards left.");
        checkMatchEnd();
        return;
    }

    if (Math.random() < 0.3 && activeAICard) {
        activeAICard.stars++;
        log("AI boosts " + activeAICard.name + " with +1 HP.");
        renderBattleCards();
        playerTurn = true;
        return;
    }

    if (activeAICard && activePlayerCard) {
        log("AI attacks with " + activeAICard.name + "!");
        resolveCombat(false);
    }

    playerTurn = true;
}

/* COMBAT */
function resolveCombat(playerInitiated) {
    if (!activePlayerCard || !activeAICard) return;

    if (activeAICard.name === "Influenza" && playerInitiated) {
        log("Influenza triggers Infection Swap!");
        let virusHP = activeAICard.stars;
        for (let i = 0; i < 3; i++) virusHP -= activePlayerCard.dmg;
        if (virusHP <= 0) {
            log("You killed Influenza!");
            koCard("aiBattleCard");
            activeAICard = null;
        } else {
            log("Influenza survives. Both cards die.");
            koCard("aiBattleCard");
            koCard("playerBattleCard");
            activeAICard = null;
            activePlayerCard = null;
            attachedBooster = null;
        }
        renderBattleCards();
        checkMatchEnd();
        return;
    }

    activeAICard.stars -= activePlayerCard.dmg;
    activePlayerCard.stars -= activeAICard.dmg;

    let pAlive = activePlayerCard.stars > 0;
    let aAlive = activeAICard.stars > 0;

    if (pAlive && !aAlive) {
        log("You win this clash!");
        koCard("aiBattleCard");
        activeAICard = null;
    } else if (!pAlive && aAlive) {
        log("AI wins this clash!");
        koCard("playerBattleCard");
        activePlayerCard = null;
        attachedBooster = null;
    } else if (!pAlive && !aAlive) {
        log("Both cards die!");
        koCard("aiBattleCard");
        koCard("playerBattleCard");
        activeAICard = null;
        activePlayerCard = null;
        attachedBooster = null;
    } else log("Both cards survive.");

    renderBattleCards();
    checkMatchEnd();
}

/* KO ANIMATION */
function koCard(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add("ko-anim");
    el.addEventListener("animationend", ()=>el.classList.remove("ko-anim"), {once:true});
}

/* MATCH END */
function checkMatchEnd() {
    const playerHas = activePlayerCard || playerDeck.length > 0;
    const aiHas = activeAICard || aiIndex < aiDeck.length;

    if (!playerHas && aiHas) {
        log("You lost the match.");
        matchWon = false;
    } else if (playerHas && !aiHas) {
        log("You won the match!");
        matchWon = true;
        rollForShinies();
    } else return;
}

/* SHINY SYSTEM */
function shinyOdds(stars) {
    if (stars <= 2) return 100;
    if (stars === 3) return 200;
    if (stars === 4) return 400;
    return 800;
}

function rollForShinies() {
    if (!matchWon) return;
    const allCards = playerDeck.concat(activePlayerCard ? [activePlayerCard] : []);
    allCards.forEach(c => {
        let odds = shinyOdds(c.stars);
        if (potions > 0 && c.stars >= 3) odds = Math.floor(odds / 2);
        if (Math.floor(Math.random()*odds) === 0) addShiny(c);
    });
}

function addShiny(card) {
    shinyStorage.push({name: card.name, stars: card.stars});
    renderStorage();
    showShinyBanner();
}

function showShinyBanner() {
    const b = document.getElementById("shinyBanner");
    b.style.display = "block";
    setTimeout(()=>b.style.display="none",1500
